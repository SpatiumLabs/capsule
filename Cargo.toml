[workspace]
resolver = "2"
members = [
  "crates/capsule-api",
  "crates/capsule-cli",
  "crates/capsule-core",
  "crates/capsule-edge",
  "crates/capsule-guest-agent",
  "crates/capsule-guest-protocol",
  "crates/capsule-host-agent",
  "crates/capsule-image",
  "crates/capsule-network-agent",
  "crates/capsule-observability",
  "crates/capsule-runtime",
  "crates/capsule-runtime-hardening",
  "crates/capsule-sandboxd",
  "crates/capsule-sandboxd-proto",
  "crates/capsule-seccomp",
  "crates/capsule-telemetry",
]
exclude = [
  "crates/capsule-network-agent-ebpf",
  "crates/capsule-observability-ebpf",
  "crates/capsule-runtime-hardening-ebpf",
  "crates/capsule-snapshot-ebpf",
]
default-members = [
  "crates/capsule-api",
  "crates/capsule-cli",
  "crates/capsule-core",
  "crates/capsule-edge",
  "crates/capsule-guest-agent",
  "crates/capsule-guest-protocol",
  "crates/capsule-host-agent",
  "crates/capsule-image",
  "crates/capsule-network-agent",
  "crates/capsule-observability",
  "crates/capsule-runtime",
  "crates/capsule-runtime-hardening",
  "crates/capsule-sandboxd",
  "crates/capsule-sandboxd-proto",
  "crates/capsule-seccomp",
  "crates/capsule-telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A secure, low-latency sandbox execution platform for agentic workloads"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
blake3 = "1.8.7"
camino = "1.2.5"

# Interdependencies
capsule-api = { path = "crates/capsule-api" }
capsule-core = { path = "crates/capsule-core" }
capsule-edge = { path = "crates/capsule-edge" }
capsule-guest-agent = { path = "crates/capsule-guest-agent" }
capsule-guest-protocol = { path = "crates/capsule-guest-protocol" }
capsule-host-agent = { path = "crates/capsule-host-agent" }
capsule-image = { path = "crates/capsule-image" }
capsule-network-agent = { path = "crates/capsule-network-agent" }
capsule-observability = { path = "crates/capsule-observability" }
capsule-runtime = { path = "crates/capsule-runtime" }
capsule-runtime-hardening = { path = "crates/capsule-runtime-hardening" }
capsule-sandboxd = { path = "crates/capsule-sandboxd" }
capsule-sandboxd-proto = { path = "crates/capsule-sandboxd-proto" }
capsule-seccomp = { path = "crates/capsule-seccomp" }
capsule-telemetry = { path = "crates/capsule-telemetry" }

cedar-policy = "4.12.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hashbrown = { version = "0.17.1", features = ["serde"] }
heapless = { version = "0.9.3", features = ["serde"] }
hickory-proto = "0.26.3"
hickory-resolver = {
  version = "0.26.3",
  default-features = false,
  features = [
    "system-config",
    "tls-ring",
    "tokio",
  ]
}
hickory-server = {
  version = "0.26.3",
  default-features = false,
  features = [
    "resolver",
  ]
}
http = "1.5.0"
libc = "0.2.189"
metrics = "0.24.6"
nix = {
  version = "0.31.3",
  features = [
    "net",
    "process",
    "resource",
    "sched",
    "user",
  ]
}
opentelemetry = "0.32.0"
opentelemetry-otlp = {
  version = "0.32.0",
  features = [
    "grpc-tonic",
    "metrics",
  ]
}
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
parking_lot = "0.12.5"
process_control = "5.2.0"
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
rustix = { version = "1.1.4", features = ["mount", "thread"] }
rustls = { version = "0.23.44" }
rustls-native-certs = "0.8.4"
seccompiler = { version = "0.5.0", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = {
  version = "0.9",
  features = [
    "chrono",
    "postgres",
    "runtime-tokio",
    "sqlite",
    "tls-rustls",
    "uuid",
  ]
}
ssh-key = { version = "0.6.7", features = ["default", "ed25519", "getrandom"] }
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
sys-info = "0.9.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = {
  version = "1.53.1",
  features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
  ]
}
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["__rustls-tls"] }
tokio-util = "0.7.19"
tokio-vsock = "0.7.2"
toml = "1.1.5"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["request-id", "trace", "util"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ulid = { version = "3.0.0", features = ["serde"] }
ureq = "3.4.1"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
zeroize = "1.9.0"
